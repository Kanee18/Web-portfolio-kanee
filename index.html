<!doctype html>
<html lang="en" class="is-loading">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Kanee — Creative Developer · A portfolio in orbit</title>
    <meta
      name="description"
      content="Creative developer portfolio — WebGL, motion and interface engineering. A scroll-driven journey through a galaxy, a ringed giant, a constellation and a black hole."
    />
    <meta name="theme-color" content="#030409" />
    <meta property="og:title" content="Kanee — Creative Developer" />
    <meta property="og:description" content="A portfolio in orbit. WebGL · Motion · Interface." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <!-- Liquid-glass refraction filters are generated into this <defs> at runtime -->
    <svg class="svg-defs" aria-hidden="true" focusable="false" width="0" height="0">
      <defs id="lg-defs"></defs>
    </svg>

    <canvas class="webgl" aria-hidden="true"></canvas>
    <div class="vignette" aria-hidden="true"></div>

    <!-- ───────────────────────────── Opening sequence ───────────────────────────── -->
    <div class="loader" role="status" aria-live="polite" aria-label="Loading">
      <div class="loader__grid" aria-hidden="true"></div>
      <div class="loader__meta loader__meta--tl"><span>KANEE</span><span>/ PORTFOLIO</span></div>
      <div class="loader__meta loader__meta--tr"><span>EDITION</span><span>2026.11</span></div>
      <div class="loader__meta loader__meta--bl"><span>RA</span><span data-loader-ra>05h 35m 17.3s</span></div>
      <div class="loader__meta loader__meta--br"><span>DEC</span><span data-loader-dec>−05° 23′ 28″</span></div>

      <div class="loader__core">
        <!-- compositor-driven spin: keeps moving even while shaders compile -->
        <div class="loader__spin" aria-hidden="true">
          <div class="loader__spin-inner"><svg viewBox="0 0 240 240"><g class="loader__ticks"></g></svg></div>
        </div>
        <svg class="loader__ring" viewBox="0 0 240 240" aria-hidden="true">
          <circle class="loader__ring-track" cx="120" cy="120" r="104" />
          <circle class="loader__ring-progress" cx="120" cy="120" r="104" />
          <circle class="loader__ring-inner" cx="120" cy="120" r="78" />
        </svg>
        <div class="loader__count" aria-hidden="true">
          <span class="loader__num" data-loader-num>000</span>
        </div>
        <div class="loader__status" data-loader-status>Aligning telescopes</div>
      </div>
      <!-- shown at 100 % — the click also unlocks audio for the soundtrack -->
      <div class="loader__start" data-loader-start>
        <div class="loader__go-wrap" data-start-wrap>
          <button class="lg lg-btn lg-btn--primary loader__go" type="button" data-start data-magnetic>
            <span class="lg-btn__label">Start the journey</span>
            <svg class="lg-btn__icon loader__play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 5.8v12.4L18.6 12z" /></svg>
          </button>
        </div>
        <button class="loader__silent" type="button" data-start-silent>Enter without sound</button>
      </div>
      <div class="loader__singularity" aria-hidden="true"></div>
      <div class="loader__flash" aria-hidden="true"></div>
    </div>

    <!-- ───────────────────────────── Cursor ───────────────────────────── -->
    <div class="cursor" aria-hidden="true">
      <div class="cursor__ring"><span class="cursor__label"></span></div>
      <div class="cursor__dot"></div>
    </div>

    <!-- ───────────────────────────── Header ───────────────────────────── -->
    <header class="header" data-header>
      <a class="brand" href="#top" data-scroll-to aria-label="Back to top">
        <svg class="brand__mark" viewBox="0 0 40 40" aria-hidden="true">
          <circle cx="20" cy="20" r="5.2" />
          <ellipse cx="20" cy="20" rx="17" ry="6.2" transform="rotate(-24 20 20)" />
        </svg>
        <span class="brand__name" data-brand-name>KANEE</span>
      </a>

      <div class="nav-wrap" data-nav-wrap>
        <nav class="nav lg" aria-label="Primary" data-nav>
          <a class="nav__link" href="#about" data-scroll-to data-nav-link="about">About</a>
          <a class="nav__link" href="#work" data-scroll-to data-nav-link="work">Work</a>
          <a class="nav__link" href="#skills" data-scroll-to data-nav-link="skills">Skills</a>
          <a class="nav__link" href="#journey" data-scroll-to data-nav-link="journey">Journey</a>
          <a class="nav__link" href="#contact" data-scroll-to data-nav-link="contact">Contact</a>
        </nav>
        <!-- the travelling lens: a sibling so its backdrop includes the nav itself -->
        <span class="nav__blob lg" aria-hidden="true" data-nav-blob></span>
      </div>

      <div class="header__actions">
        <button class="lg lg-btn lg-btn--icon sound" type="button" aria-pressed="false" aria-label="Toggle ambient sound" data-sound>
          <span class="sound__bars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
        </button>
        <a class="lg lg-btn lg-btn--sm header__cta" href="#contact" data-scroll-to data-magnetic>
          <span class="lg-btn__label">Let’s talk</span>
        </a>
        <button class="lg lg-btn lg-btn--sm menu-toggle" type="button" aria-expanded="false" aria-controls="mobile-menu" data-menu-toggle>
          <span class="lg-btn__label">Menu</span>
        </button>
      </div>
    </header>

    <div class="mobile-menu" id="mobile-menu" data-mobile-menu hidden>
      <nav aria-label="Mobile">
        <a href="#about" data-scroll-to>About</a>
        <a href="#work" data-scroll-to>Work</a>
        <a href="#skills" data-scroll-to>Skills</a>
        <a href="#journey" data-scroll-to>Journey</a>
        <a href="#contact" data-scroll-to>Contact</a>
      </nav>
    </div>

    <!-- ───────────────────────────── HUD ───────────────────────────── -->
    <div class="hud" aria-hidden="true" data-hud>
      <div class="hud__stack">
        <div class="hud__cell">
          <span class="hud__k">Sector</span><span class="hud__v" data-hud-sector>01 / 06</span>
        </div>
        <div class="hud__rail" data-hud-rail>
          <span class="hud__rail-fill" data-hud-fill></span>
        </div>
        <div class="hud__cell">
          <span class="hud__k">Vel</span><span class="hud__v" data-hud-vel>0.000c</span>
        </div>
        <div class="hud__cell">
          <span class="hud__k">Dist</span><span class="hud__v" data-hud-dist>0 LY</span>
        </div>
        <div class="hud__cell hud__cell--pos">
          <span class="hud__k">Pos</span><span class="hud__v" data-hud-pos>+0.0 +0.0 +0.0</span>
        </div>
      </div>
    </div>

    <!-- ───────────────────────────── Content (rendered from src/content.js) ───────────────────────────── -->
    <main id="main" class="main" data-main></main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
